name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          # The upgrade-safety baseline is built from the release tag.
          fetch-depth: 0
          fetch-tags: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Same image as local development, so CI and laptops use identical tool versions.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./docker
          load: true
          tags: postlayer-tools:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Format, build, test, static analysis
        run: make ci
        env:
          FOUNDRY_PROFILE: ci
