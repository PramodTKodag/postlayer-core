version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  # Slither and its dependencies, pinned by hash in docker/slither-requirements.txt.
  - package-ecosystem: pip
    directory: /docker
    schedule:
      interval: weekly
    groups:
      pip:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
  # Solidity dependencies (OpenZeppelin, forge-std). A bump changes bytecode and may change storage layout:
  # review it like a contract change, and run make test-upgrades.
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
