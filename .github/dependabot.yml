version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  # No pip entry: Dependabot bumps the pins in docker/slither-requirements.txt one by one, without checking that the set still
  # installs on the image's Python 3.10 or satisfies pip check. Refresh that file by hand (docs/DEVELOPMENT.md).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
  # Solidity dependencies (OpenZeppelin, forge-std). A bump changes bytecode and may change storage layout:
  # review it like a contract change, and run make test-upgrades.
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
