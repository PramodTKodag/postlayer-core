name: Feature request
description: Propose a change or addition
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Say what changes in the contracts, scripts or docs.
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: Does it touch funds, access control, upgrades or storage layout?
      description: Write "no" if not. If yes, explain how it stays safe.
    validations:
      required: true
