name: Bug report
description: Something does not work as documented (not a security vulnerability)
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Security problems go through [SECURITY.md](https://github.com/PramodTKodag/postlayer/blob/main/SECURITY.md), not here.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: A failing test or the exact `make` commands is ideal.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or tag
      placeholder: e.g. testnet-0.1.0 or a commit hash
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Output
      description: Remove RPC URLs, API keys and keystore paths before pasting.
      render: shell
