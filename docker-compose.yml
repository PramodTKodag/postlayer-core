name: postlayer-core

# Shared by every service so the tool versions pinned in docker/Dockerfile are used everywhere.
x-tools-image: &tools-image postlayer-core-tools:local

services:
  # One-off commands (build, test, analysis). Started by `make` targets, not by `up`.
  tools: &tools-service
    image: *tools-image
    build:
      context: ./docker
    profiles: ["tools"]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /workspace
    environment:
      # Lets CI (or you) select a foundry.toml profile: FOUNDRY_PROFILE=ci make test
      - FOUNDRY_PROFILE
      # make test-fork: the fork RPC URL travels by name, so it never appears in a command line
      - FORK_RPC_URL
    volumes:
      - .:/workspace
      - svm-cache:/home/foundry/.svm
      - foundry-cache:/home/foundry/.foundry/cache

  # Real-chain releases only (make release-*). This is the only service that mounts the operator's Foundry keystores
  # and the only one that receives .env as environment variables. It does not hide .env from the others: the file
  # sits in the workspace mount every tooling container reads, and forge auto-loads ./.env wherever it runs (which is
  # why the fork test is opt-in).
  # What a release deploys must not be influenced by the other tooling containers (the upgrade validator runs
  # third-party code with ffi in `tools`). So its build output and forge cache live in the container's own /tmp and
  # are gone when it exits: every make release-* command compiles from scratch instead of trusting whatever sits in
  # the workspace's out/ and cache/. Its compiler binaries and RPC cache are volumes `tools` does not mount.
  release:
    <<: *tools-service # takes the image, user and working_dir of `tools`; a merge replaces a key's whole value, so volumes is listed again below
    profiles: ["tools"]
    environment:
      - FOUNDRY_PROFILE=default # the manifest reads [profile.default]
      - FOUNDRY_OUT=/tmp/release-out
      - FOUNDRY_CACHE_PATH=/tmp/release-cache
    env_file:
      - path: .env
        required: false # `make release-*` checks it exists; absent must not break `tools`
    volumes: # the workspace again, its own compiler and RPC caches, plus the keystores
      - .:/workspace
      - release-svm-cache:/home/foundry/.svm
      - release-foundry-cache:/home/foundry/.foundry/cache
      - ${KEYSTORE_DIR:-/var/empty}:/home/foundry/.foundry/keystores:ro

  # Two local chains with different chain IDs, to test same-address deployment across chains.
  # Anvil's default accounts and mnemonic are public: never fund them on a real network.
  anvil-a:
    image: *tools-image
    command: ["anvil --host 0.0.0.0 --port 8545 --chain-id 31337"]
    ports:
      - "127.0.0.1:8545:8545"
    healthcheck:
      test: ["CMD-SHELL", "cast chain-id --rpc-url http://127.0.0.1:8545"]
      interval: 5s
      timeout: 5s
      retries: 10

  anvil-b:
    image: *tools-image
    command: ["anvil --host 0.0.0.0 --port 8545 --chain-id 31338"]
    ports:
      - "127.0.0.1:8546:8545"
    healthcheck:
      test: ["CMD-SHELL", "cast chain-id --rpc-url http://127.0.0.1:8545"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  svm-cache:
  foundry-cache:
  release-svm-cache:
  release-foundry-cache:
